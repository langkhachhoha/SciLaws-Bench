<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SciLaws Trace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500&display=swap">
<style>
/* Layout: the task index on the left; one sticky band with the hidden law and each
   run's trace; below it the transcript, in the order the agent's loop ran.
   Type carries the three voices of a turn: serif for what the model thinks to
   itself, sans for what it writes, mono for what machines exchange. */
:root {
  --bg: #f3f5f7; --panel: #ffffff; --ink: #15202b; --ink-2: #47535f; --ink-3: #5f6b78;
  --line: #dde3e9; --line-2: #c8d0d8; --sel: #e6eef8; --accent: #256abf;
  --think: #f2f0fa; --code: #f6f8fa;
  --exp: #2a78d6; --exp-on: #ffffff; --py: #cfd6dd; --py-on: #15202b;
  --final: #eb6834; --final-on: #0b0b0b; --fail: #d03b3b; --fail-on: #ffffff;
  --fail-bg: #fdeeee; --fail-ink: #a32525; --warn-bg: #fdf3dc; --warn-ink: #6f4b00;
  --s1: #6cc4a0; --s1-on: #0b0b0b; --s2: #3fae85; --s2-on: #0b0b0b;
  --s3: #178a61; --s3-on: #ffffff; --s4: #0b6045; --s4-on: #ffffff;
  --syn-kw: #8a3fa8; --syn-str: #1d7a55; --syn-com: #6b7682;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "IBM Plex Serif", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1419; --panel: #171d23; --ink: #e6ebf0; --ink-2: #b3bdc7; --ink-3: #96a1ad;
    --line: #2a323a; --line-2: #3a444e; --sel: #1f2c3b; --accent: #6da7ec;
    --think: #1f1c2e; --code: #12171c;
    --exp: #3987e5; --exp-on: #ffffff; --py: #46515c; --py-on: #e6ebf0;
    --final: #d95926; --final-on: #ffffff; --fail: #d03b3b; --fail-on: #ffffff;
    --fail-bg: #351a1c; --fail-ink: #f2a3a3; --warn-bg: #33290f; --warn-ink: #eec766;
    --s1: #1f5a45; --s1-on: #d8f3e8; --s2: #1f8a63; --s2-on: #ffffff;
    --s3: #3dbb8c; --s3-on: #0b0b0b; --s4: #8fe3c1; --s4-on: #0b0b0b;
    --syn-kw: #c99be0; --syn-str: #7fd6b0; --syn-com: #85919d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1419; --panel: #171d23; --ink: #e6ebf0; --ink-2: #b3bdc7; --ink-3: #96a1ad;
  --line: #2a323a; --line-2: #3a444e; --sel: #1f2c3b; --accent: #6da7ec;
  --think: #1f1c2e; --code: #12171c;
  --exp: #3987e5; --exp-on: #ffffff; --py: #46515c; --py-on: #e6ebf0;
  --final: #d95926; --final-on: #ffffff; --fail: #d03b3b; --fail-on: #ffffff;
  --fail-bg: #351a1c; --fail-ink: #f2a3a3; --warn-bg: #33290f; --warn-ink: #eec766;
  --s1: #1f5a45; --s1-on: #d8f3e8; --s2: #1f8a63; --s2-on: #ffffff;
  --s3: #3dbb8c; --s3-on: #0b0b0b; --s4: #8fe3c1; --s4-on: #0b0b0b;
  --syn-kw: #c99be0; --syn-str: #7fd6b0; --syn-com: #85919d;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  display: grid; grid-template-rows: auto minmax(0, 1fr); background: var(--bg); color: var(--ink);
  font: 400 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
h1, h2, h3, p, ul { margin: 0; padding: 0; }
.mono { font-family: var(--mono); }

/* Run bar */
#bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 16px;
  background: var(--panel); border-bottom: 1px solid var(--line);
}
#bar h1 { font-size: 14px; font-weight: 600; letter-spacing: .01em; }
#chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: baseline; gap: 8px; padding: 2px 4px 2px 10px;
  border: 1px solid var(--line-2); border-radius: 3px; font: 400 12px/20px var(--mono);
}
.chip b { font-weight: 600; font-variant-numeric: tabular-nums; }
.chip button { padding: 0 6px; color: var(--ink-3); }
.chip button:hover { color: var(--fail-ink); }
#add { display: flex; flex: 1 1 340px; gap: 6px; min-width: 0; }
#path {
  flex: 1; min-width: 0; padding: 4px 8px; background: var(--bg); border: 1px solid var(--line-2);
  border-radius: 3px; font: 400 12.5px/20px var(--mono);
}
#add button {
  padding: 4px 12px; border-radius: 3px; background: var(--ink); color: var(--panel); font-weight: 500; font-size: 13px;
}
#barerr { flex-basis: 100%; color: var(--fail-ink); font-size: 13px; }

#app { display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); min-height: 0; }

/* Task index */
#side { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); min-height: 0; background: var(--panel); border-right: 1px solid var(--line); }
#tools { display: flex; gap: 6px; padding: 8px 12px; }
#tools input, #tools select {
  min-width: 0; padding: 3px 6px; background: var(--bg); border: 1px solid var(--line-2); border-radius: 3px; font-size: 13px;
}
#tools input { flex: 1; }
.cols, .task { display: grid; grid-template-columns: minmax(0, 1fr) repeat(var(--n), 46px); gap: 2px; align-items: center; padding-inline: 12px; }
.cols { padding-block: 4px; border-bottom: 1px solid var(--line); color: var(--ink-3); font-size: 11.5px; }
.cols span { overflow: hidden; text-overflow: ellipsis; text-align: center; white-space: nowrap; }
.cols span:first-child { text-align: left; }
#tasks { overflow-y: auto; }
.task { width: 100%; padding-block: 5px; text-align: left; border-bottom: 1px solid var(--line); }
.task:hover { background: var(--bg); }
.task.on { background: var(--sel); }
.task .who { min-width: 0; }
.task .dom, .task .tgt { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task .dom { font-size: 13px; line-height: 1.3; }
.task .tgt { color: var(--ink-3); font: 400 11.5px/1.3 var(--mono); }

/* Scores: one hue, darker is better, always with the number */
.sc {
  display: inline-block; min-width: 42px; padding-inline: 4px; border-radius: 3px; text-align: center;
  font: 500 11.5px/22px var(--mono); font-variant-numeric: tabular-nums;
}
.sc.s0 { box-shadow: inset 0 0 0 1.5px var(--fail); color: var(--fail-ink); }
.sc.s1 { background: var(--s1); color: var(--s1-on); }
.sc.s2 { background: var(--s2); color: var(--s2-on); }
.sc.s3 { background: var(--s3); color: var(--s3-on); }
.sc.s4 { background: var(--s4); color: var(--s4-on); }
.sc.na { color: var(--ink-3); }

/* Sticky band */
#main { position: relative; overflow-y: auto; min-width: 0; overflow-anchor: none; }  /* the band grows; what is under it must move with it */
#head { position: sticky; top: 0; z-index: 5; padding: 10px 20px 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
#titleline { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 20px; align-items: baseline; }
#titleline h2 { font: 500 14px/1.4 var(--mono); overflow-wrap: anywhere; }
#legend { display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: center; color: var(--ink-3); font-size: 12px; }
#legend span { display: inline-flex; gap: 4px; align-items: center; }
#legend .c { flex: none; width: 16px; height: 16px; font-size: 10px; line-height: 16px; }
kbd { padding: 0 4px; border: 1px solid var(--line-2); border-radius: 3px; font: 400 11px/15px var(--mono); }
#law { margin-top: 4px; color: var(--ink-2); font-size: 13.5px; line-height: 1.4; }
#law b { color: var(--ink-3); font-size: 12px; font-weight: 500; margin-right: 6px; }
#law code { font-family: var(--mono); font-size: 12.5px; color: var(--ink); }
#law button { margin-left: 10px; color: var(--accent); font-size: 12.5px; white-space: nowrap; }
#law button:hover { text-decoration: underline; }
#truth { margin-top: 6px; max-height: 36vh; white-space: pre-wrap; overflow-wrap: anywhere; }
#rows { display: grid; gap: 2px; margin-top: 8px; }
.row {
  display: grid; grid-template-columns: minmax(0, 176px) 40px minmax(0, 1fr) auto; gap: 8px; align-items: center;
  padding: 1px 4px; margin-inline: -4px; border-radius: 3px;
}
.row.on { background: var(--sel); }
.row .name { overflow: hidden; text-align: left; text-overflow: ellipsis; white-space: nowrap; font: 400 12px/22px var(--mono); }
.row.on .name { font-weight: 600; }
.row .name:hover { text-decoration: underline; }
.row .sc { min-width: 40px; }
.row .stat { color: var(--ink-3); font: 400 11.5px/22px var(--mono); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* The trace: one cell per turn, empty to the budget so an early stop shows */
.trace { display: flex; gap: 2px; min-width: 0; container-type: inline-size; }
.c {
  display: block; flex: 0 1 22px; min-width: 0; height: 20px; overflow: hidden; border-radius: 2px;
  text-align: center; font: 600 10.5px/20px var(--mono);
}
.c.E { background: var(--exp); color: var(--exp-on); }
.c.P { background: var(--py); color: var(--py-on); }
.c.F { background: var(--final); color: var(--final-on); }
.c.bad { background: var(--fail); color: var(--fail-on); }
.c.empty { box-shadow: inset 0 0 0 1px var(--line); }
.c.cur { outline: 2px solid var(--ink); outline-offset: 1px; }
@container (max-width: 340px) { .trace .c { font-size: 0; } }  /* too narrow for letters */

/* Transcript */
#flow { max-width: 1040px; padding: 16px 20px 96px; }
.step { position: relative; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 0 14px; padding-bottom: 22px; }
.step::before { content: ""; position: absolute; top: 4px; bottom: -4px; left: 11.5px; width: 1px; background: var(--line-2); }
.step:last-child::before { display: none; }
.step > .c { position: relative; z-index: 1; width: 24px; height: 24px; line-height: 24px; font-size: 11.5px; border-radius: 3px; }
.c.I, .c.J { background: var(--ink); color: var(--panel); }
.stephead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0 16px; min-height: 24px; margin-bottom: 6px; }
.stephead h3 { font-size: 14px; font-weight: 600; }
.stephead h3 .turnno { color: var(--ink-3); font-weight: 400; margin-right: 6px; font-variant-numeric: tabular-nums; }
.stephead .meter { color: var(--ink-3); font: 400 11.5px/20px var(--mono); font-variant-numeric: tabular-nums; }
.flag { margin-left: 8px; padding: 0 6px; border-radius: 3px; background: var(--fail-bg); color: var(--fail-ink); font-size: 12px; font-weight: 500; }

.part { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 0 10px; padding-block: 3px; }
.part > .lab { align-self: start; padding-top: 5px; color: var(--ink-3); font-size: 12px; line-height: 1.3; text-align: left; }
.part > .lab.fold::after { content: " ▾"; }
.part.shut > .lab.fold::after { content: " ▸"; }
.part.shut > .body { display: none; }
.part.shut::after { content: "đã thu gọn"; color: var(--ink-3); font-size: 12px; padding-top: 5px; }
.think > .body {
  padding: 8px 12px; background: var(--think); border-radius: 3px; white-space: pre-wrap; overflow-wrap: anywhere;
  font: 400 14.5px/1.6 var(--serif); max-width: 82ch;
}
.said { padding-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 82ch; }
.void { padding-top: 4px; color: var(--ink-3); font-style: italic; }
pre {
  margin: 0; padding: 8px 10px; max-height: 28rem; overflow: auto; background: var(--code); border: 1px solid var(--line);
  border-radius: 3px; font: 400 12.5px/1.5 var(--mono); tab-size: 4;
}
pre.wrap { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 30rem; }
pre.formula { border-color: var(--final); max-height: none; }
pre.bad { border-color: var(--fail); }
.syn-kw { color: var(--syn-kw); } .syn-str { color: var(--syn-str); } .syn-com { color: var(--syn-com); }
.box { padding: 6px 10px; border-radius: 3px; font-size: 13.5px; overflow-wrap: anywhere; }
.box.err { background: var(--fail-bg); color: var(--fail-ink); }
.box.warn { background: var(--warn-bg); color: var(--warn-ink); }
.box + .box, .box + details, pre + .box { margin-top: 4px; }
details summary { color: var(--ink-3); cursor: pointer; font-size: 12.5px; padding-block: 3px; }
details pre { margin-top: 2px; }

.req { display: grid; gap: 2px; padding-top: 4px; font-size: 13.5px; }
.vary { display: grid; grid-template-columns: minmax(0, max-content) minmax(0, 1fr); gap: 0 10px; }
.vary b, .fixed b { font: 500 12.5px/1.6 var(--mono); }
.vals { font: 400 12.5px/1.6 var(--mono); overflow-wrap: anywhere; }
.vals i { color: var(--ink-3); font-style: normal; margin-left: 6px; font-family: var(--sans); font-size: 12px; }
.fixed { color: var(--ink-2); }
.fixed .mono { font-size: 12.5px; }
.sum { color: var(--ink-3); font-size: 12.5px; }

.tablewrap { max-width: 100%; overflow-x: auto; border: 1px solid var(--line); border-radius: 3px; }
table { border-collapse: collapse; font: 400 12.5px/1.4 var(--mono); font-variant-numeric: tabular-nums; }
th, td { padding: 2px 10px; text-align: right; white-space: nowrap; }
th { background: var(--code); color: var(--ink-3); font-weight: 500; }
td:first-child, th:first-child { font-weight: 600; color: var(--ink); }
tr + tr td { border-top: 1px solid var(--line); }

.compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding-block: 3px; }
.compare h4 { margin: 0 0 3px; font-size: 13px; font-weight: 600; }
.compare pre { max-height: none; white-space: pre-wrap; overflow-wrap: anywhere; }
.lists { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 24px; }
.lists h4 { margin: 0 0 2px; font-size: 13px; font-weight: 600; }
.lists ul { padding-left: 18px; font-size: 13.5px; }
.lists li + li { margin-top: 3px; }
#empty { padding: 48px 24px; color: var(--ink-2); max-width: 60ch; }

@media (max-width: 1240px) {
  #app { grid-template-columns: 300px minmax(0, 1fr); }
  .row { grid-template-columns: minmax(0, 132px) 40px minmax(0, 1fr); }
  .row .stat { display: none; }
}
@media (max-width: 900px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 38vh minmax(0, 1fr); }
  #side { border-right: 0; border-bottom: 1px solid var(--line); }
  .row { grid-template-columns: minmax(0, 1fr) 40px; }
  .row .trace { grid-column: 1 / -1; }
  .part { grid-template-columns: minmax(0, 1fr); }
  .lists, .compare { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<header id="bar">
  <h1>SciLaws Trace</h1>
  <div id="chips"></div>
  <form id="add">
    <input id="path" aria-label="Đường dẫn tới thư mục kết quả" autocomplete="off" spellcheck="false"
           placeholder="Dán đường dẫn kết quả, ví dụ experiments/parallel_typeI_br-glm-5">
    <button type="submit">Thêm run</button>
  </form>
  <div id="barerr" hidden></div>
</header>
<div id="app">
  <nav id="side" aria-label="Danh sách bài">
    <div id="tools">
      <input id="q" type="search" placeholder="Tìm bài" aria-label="Tìm bài">
      <select id="sort" aria-label="Sắp xếp">
        <option value="name">Theo tên</option>
        <option value="low">Điểm thấp trước</option>
        <option value="gap">Chênh lệch lớn trước</option>
      </select>
    </div>
    <div class="cols" id="cols"></div>
    <div id="tasks"></div>
  </nav>
  <main id="main">
    <div id="head" hidden>
      <div id="titleline">
        <h2 id="title"></h2>
        <div id="legend">
          <span><i class="c E">E</i>experiment</span>
          <span><i class="c P">P</i>python</span>
          <span><i class="c F">F</i>nộp</span>
          <span><i class="c bad">E</i>bị từ chối hoặc lỗi</span>
          <span><kbd>j</kbd><kbd>k</kbd>đổi turn</span>
          <span><kbd>g</kbd>ground truth</span>
        </div>
      </div>
      <p id="law" hidden></p>
      <pre id="truth" hidden></pre>
      <div id="rows"></div>
    </div>
    <div id="flow"></div>
    <div id="empty" hidden></div>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const dec = v => String(v).replace(".", ",");
const fmtScore = v => v == null ? "–" : dec(v);
const fmtSS = v => v == null ? "–" : dec(v.toFixed(3));
const fmtTok = n => n >= 1000 ? dec((n / 1000).toFixed(1)) + "k" : String(n);
const scoreClass = v => v == null ? "na" : "s" + Math.round(v * 4);
const scoreCell = v => `<span class="sc ${scoreClass(v)}">${fmtScore(v)}</span>`;
const fmtVal = v => typeof v === "number" ? String(+v.toPrecision(5)) : esc(v);

const S = {paths: [], series: [], task: null, sid: null, turn: null, detail: null, cache: new Map(), ticket: 0, truthOpen: false};

async function api(path, params) {
  const res = await fetch(path + "?" + new URLSearchParams(params));
  const body = await res.json();
  if (!res.ok) throw new Error(body.error);
  return body;
}

/* Runs ---------------------------------------------------------------------- */
async function loadRuns() {
  const got = await Promise.allSettled(S.paths.map(p => api("/api/runs", {path: p})));
  const byId = new Map(), errors = [];
  got.forEach(r => r.status === "fulfilled"
    ? r.value.series.forEach(s => byId.set(s.id, s))
    : errors.push(r.reason.message));
  S.series = [...byId.values()];
  $("#barerr").hidden = !errors.length;
  $("#barerr").textContent = errors.join(" ");
  return !errors.length;
}

function writeRunsToUrl() {
  const q = new URLSearchParams();
  S.paths.forEach(p => q.append("run", p));
  history.replaceState(null, "", "?" + q + location.hash);
}

function renderBar() {
  $("#chips").innerHTML = S.series.map(s => {
    const headline = s.s_s != null ? `S_S ${fmtSS(s.s_s)}`
      : s.n_scored ? `TB ${fmtSS(s.mean_scored)} trên ${s.n_scored} bài` : `${s.n_tasks} bài, chưa chấm`;
    return `<span class="chip" title="${esc(s.path)}">${esc(s.label)} <b>${headline}</b>` +
      `<button type="button" data-drop="${esc(s.id)}" aria-label="Bỏ ${esc(s.label)}">×</button></span>`;
  }).join("");
}

$("#chips").addEventListener("click", async e => {
  const id = e.target.dataset.drop;
  if (!id) return;
  const gone = S.series.find(s => s.id === id).path;
  S.paths = [...new Set(S.series.map(s => s.path))].filter(p => p !== gone);
  writeRunsToUrl();
  await refresh();
});

$("#add").addEventListener("submit", async e => {
  e.preventDefault();
  const path = $("#path").value.trim();
  if (!path) return;
  S.paths.push(path);
  if (await refresh()) {
    $("#path").value = "";
    writeRunsToUrl();
  } else {
    S.paths.pop();
  }
});

/* Task index ---------------------------------------------------------------- */
function allTasks() {
  const names = new Set();
  S.series.forEach(s => Object.keys(s.tasks).forEach(t => names.add(t)));
  return [...names];
}

function taskScores(task) {
  return S.series.map(s => s.tasks[task]?.score ?? null);
}

function sortedTasks() {
  const q = $("#q").value.trim().toLowerCase().replace(/\s+/g, "_");
  const names = allTasks().filter(t => t.toLowerCase().includes(q));
  const known = t => taskScores(t).filter(v => v != null);
  const mean = t => known(t).length ? known(t).reduce((a, b) => a + b) / known(t).length : 9;
  const gap = t => known(t).length ? Math.max(...known(t)) - Math.min(...known(t)) : -1;
  const byName = (a, b) => a.localeCompare(b);
  const order = $("#sort").value;
  if (order === "low") return names.sort((a, b) => mean(a) - mean(b) || byName(a, b));
  if (order === "gap") return names.sort((a, b) => gap(b) - gap(a) || byName(a, b));
  return names.sort(byName);
}

function renderTasks() {
  const names = sortedTasks();
  document.documentElement.style.setProperty("--n", S.series.length);
  $("#cols").innerHTML = `<span>${names.length} bài</span>` +
    S.series.map(s => `<span title="${esc(s.label)}">${esc(s.short)}</span>`).join("");
  $("#tasks").innerHTML = names.map(t => {
    const [dom, tgt] = t.split("__");
    return `<button class="task${t === S.task ? " on" : ""}" data-task="${esc(t)}" title="${esc(t)}">` +
      `<span class="who"><span class="dom">${esc(dom.replaceAll("_", " "))}</span><span class="tgt">${esc(tgt ?? "")}</span></span>` +
      taskScores(t).map(scoreCell).join("") + "</button>";
  }).join("");
}

$("#tasks").addEventListener("click", e => {
  const row = e.target.closest(".task");
  if (row) show(row.dataset.task, S.sid);
});
$("#q").addEventListener("input", renderTasks);
$("#sort").addEventListener("change", renderTasks);

/* Sticky band --------------------------------------------------------------- */
const CELL_NAME = {E: "experiment", P: "python", F: "nộp", "?": "không hợp lệ"};

function traceCells(s, task) {
  const t = s.tasks[task];
  const letters = t ? [...t.cells] : [];
  const cells = letters.map((ch, i) => {
    const kind = ch.toUpperCase(), bad = ch !== kind || ch === "?";
    const what = CELL_NAME[kind] + (ch !== kind ? " bị từ chối hoặc lỗi" : "");
    return `<button class="c ${bad ? "bad" : kind}" data-n="${i + 1}" title="Turn ${i + 1}: ${what}">${kind}</button>`;
  });
  for (let i = letters.length; i < s.max_turns; i++) cells.push('<span class="c empty"></span>');
  return cells.join("");
}

function renderHead() {
  const d = S.detail;
  $("#head").hidden = false;
  $("#title").textContent = S.task;
  const law = d?.judge?.gt_summary, truth = d?.truth;
  $("#law").hidden = !law && !truth;
  $("#law").innerHTML = (law ? `<b>Luật ẩn</b><code>${esc(law)}</code>` : "") +
    (truth ? `<button>${S.truthOpen ? "Ẩn" : "Xem"} code ground truth</button>` : "");
  $("#truth").hidden = !truth || !S.truthOpen;
  $("#truth").innerHTML = truth ? highlight(truth) : "";
  $("#rows").innerHTML = S.series.map(s => {
    const t = s.tasks[S.task];
    const stat = !t ? "không có bài này"
      : `${t.cells.length} turn · ${t.experiments}/${s.max_experiments} exp` +
        (t.status.startsWith("running") ? " · đang chạy" : "");
    return `<div class="row${s.id === S.sid ? " on" : ""}" data-sid="${esc(s.id)}">` +
      `<button class="name" title="${esc(s.path)}">${esc(s.label)}</button>` +
      `<button class="tojudge" title="Xem phần chấm điểm">${scoreCell(t?.score ?? null)}</button>` +
      `<div class="trace">${t ? traceCells(s, S.task) : ""}</div><span class="stat">${stat}</span></div>`;
  }).join("");
  markCurrent();
}

function toggleTruth() {
  if (!S.detail?.truth) return;
  S.truthOpen = !S.truthOpen;
  renderHead();
}

$("#law").addEventListener("click", e => {
  if (e.target.closest("button")) toggleTruth();
});

$("#rows").addEventListener("click", async e => {
  const row = e.target.closest(".row");
  if (!row || !e.target.closest("button")) return;
  const cell = e.target.closest(".c");
  const target = cell ? `t${cell.dataset.n}` : e.target.closest(".tojudge") ? "judge" : "top";
  if (row.dataset.sid !== S.sid) await show(S.task, row.dataset.sid);
  goTo(target);
});

function markCurrent() {
  document.querySelectorAll("#rows .c.cur").forEach(c => c.classList.remove("cur"));
  const row = [...document.querySelectorAll("#rows .row")].find(r => r.dataset.sid === S.sid);
  row?.querySelector(`.c[data-n="${S.turn}"]`)?.classList.add("cur");
}

/* Transcript ---------------------------------------------------------------- */
function highlight(code) {
  const re = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|\b(def|return|import|from|as|for|in|if|elif|else|while|try|except|with|lambda|class|not|and|or|True|False|None)\b/g;
  let out = "", last = 0, m;
  while ((m = re.exec(code))) {
    const cls = m[1] ? "com" : m[2] ? "str" : "kw";
    out += esc(code.slice(last, m.index)) + `<span class="syn-${cls}">${esc(m[0])}</span>`;
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}

const part = (label, html, extra = "") => `<div class="part ${extra}"><span class="lab">${label}</span><div class="body">${html}</div></div>`;

function renderRequest(t) {
  if (!t.request) return `<pre class="wrap">${esc(t.body)}</pre>`;
  const {n_samples: samples, seed, ...inputs} = t.request;
  const columns = Object.entries(inputs).map(([k, v]) => {
    const list = Array.isArray(v) ? v : [v];
    return {k, len: list.length, uniq: [...new Set(list)]};
  });
  const equal = new Set(columns.map(c => c.len)).size === 1;
  const held = columns.filter(c => equal && c.uniq.length === 1);
  const varied = columns.filter(c => !held.includes(c));
  const shown = c => {
    const head = c.uniq.slice(0, 16).map(fmtVal).join(" · ");
    const more = c.uniq.length > 16 ? ` … +${c.uniq.length - 16}` : "";
    const note = equal ? `${c.uniq.length} giá trị` : `mảng dài ${c.len}`;
    return `<b>${esc(c.k)}</b><span class="vals">${head}${more}<i>${note}</i></span>`;
  };
  const points = equal && columns.length ? columns[0].len : null;
  const size = points ? `${points} điểm × ${samples ?? 1} mẫu = ${points * (samples ?? 1)} dòng` : "";
  return `<div class="req">` +
    (varied.length ? `<div class="vary">${varied.map(shown).join("")}</div>` : "") +
    (held.length ? `<div class="fixed">Giữ cố định ${held.map(c => `<b>${esc(c.k)}</b> <span class="mono">= ${fmtVal(c.uniq[0])}</span>`).join(", ")}</div>` : "") +
    `<div class="sum">${[size, seed != null ? `seed ${seed}` : ""].filter(Boolean).join(" · ")}</div></div>` +
    `<details><summary>JSON model viết</summary><pre class="wrap">${esc(t.body)}</pre></details>`;
}

function renderResult(t) {
  const r = t.result;
  if (!r) return `<pre class="wrap">${esc(t.output)}</pre>`;
  if (r.error) {
    const fix = r.how_to_fix ? `<div class="box warn">${esc(r.how_to_fix)}</div>` : "";
    const corrected = r.corrected_request ? `<details><summary>corrected_request gửi lại cho model</summary><pre class="wrap">${esc(JSON.stringify(r.corrected_request))}</pre></details>` : "";
    return `<div class="box err">${esc(r.error)}</div>${fix}${corrected}`;
  }
  const rows = r.preview_rows ?? [];
  const cols = Object.keys(rows[0] ?? {});
  const table = rows.length ? `<div class="tablewrap"><table><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead>` +
    `<tbody>${rows.map(row => `<tr>${cols.map(c => `<td>${fmtVal(row[c])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>` : "";
  const clipped = r.n_clipped ? `<div class="box warn">${r.n_clipped} điểm vượt miền, bị kẹp về biên (n_clipped).</div>` : "";
  return table + clipped +
    `<div class="sum">Model thấy ${rows.length}/${r.n_returned} dòng ở đây · train_df có ${r.train_rows_total} dòng</div>`;
}

function renderFinal(t, truth) {
  const submitted = `<pre class="formula">${highlight(t.body ?? "")}</pre>`;
  if (!truth) return part("Công thức", submitted);
  return `<div class="compare"><div><h4>Ground truth</h4><pre>${highlight(truth)}</pre></div>` +
    `<div><h4>Model nộp</h4>${submitted}</div></div>`;
}

function turnTitle(t) {
  if (t.kind === "experiment") return t.ok ? `Experiment ${t.experiments}` : "Experiment bị từ chối";
  if (t.kind === "python") return t.ok ? "Python" : "Python lỗi";
  if (t.kind === "final") return "Nộp công thức";
  if (t.kind === "pending") return "Đang chờ phản hồi";
  return "Trả lời không hợp lệ";
}

function renderTurn(t, s) {
  const letter = {experiment: "E", python: "P", final: "F"}[t.kind] ?? "?";
  const flags = (t.cut ? '<span class="flag">bị cắt do hết token</span>' : "") +
    (t.blocks > 1 ? `<span class="flag">viết ${t.blocks} block, chỉ chạy 1</span>` : "");
  const meter = `exp ${t.experiments}/${s.max_experiments} · ${t.rows} dòng · in ${fmtTok(t.tokens[0])} · out ${fmtTok(t.tokens[1])}`;
  const parts = [];
  if (t.reasoning) parts.push(`<div class="part think"><button class="lab fold">Reasoning</button><div class="body">${esc(t.reasoning)}</div></div>`);
  if (t.text) parts.push(part("Trả lời", `<div class="said">${esc(t.text)}</div>`));
  if (t.kind === "experiment") {
    parts.push(part("Yêu cầu", renderRequest(t)));
    parts.push(part("Phản hồi", renderResult(t)));
  } else if (t.kind === "python") {
    parts.push(part("Code", `<pre>${highlight(t.body ?? "")}</pre>`));
    parts.push(part("Output", `<pre class="${t.ok ? "" : "bad"}">${esc(t.output)}</pre>`));
  } else if (t.kind === "final") {
    parts.push(renderFinal(t, S.detail.truth));
  } else if (t.kind === "invalid") {
    if (!t.text && !t.body) parts.push(part("Trả lời", '<div class="void">Model trả về rỗng.</div>'));
    else if (t.body) parts.push(part("Đã viết", `<pre class="wrap">${esc(t.body)}</pre>`));
    parts.push(part("Phản hồi", `<div class="box err">${esc(t.output)}</div>`));
  }
  if (t.notice) parts.push(part("Hệ thống", `<div class="box warn">${esc(t.notice)}</div>`));
  return `<article class="step turn" id="t${t.n}" data-n="${t.n}"><span class="c ${t.ok ? letter : "bad"}">${letter}</span><div>` +
    `<div class="stephead"><h3><span class="turnno">Turn ${t.n}/${s.max_turns}</span>${turnTitle(t)}${flags}</h3><span class="meter">${meter}</span></div>` +
    parts.join("") + "</div></article>";
}

function renderInput(d) {
  return `<article class="step" id="top"><span class="c I">I</span><div>` +
    `<div class="stephead"><h3>Input cho model</h3></div>` +
    (d.target ? `<p class="said"><b>Target</b> ${esc(d.target)}</p>` : "") +
    `<p class="sum">Mỗi turn model nhận lại toàn bộ lịch sử gồm đề bài, các trả lời và phản hồi. Reasoning không nằm trong lịch sử đó.</p>` +
    `<details><summary>System prompt · ${d.system.length.toLocaleString("vi-VN")} ký tự</summary><pre class="wrap">${esc(d.system)}</pre></details>` +
    `<details><summary>Đề bài · ${d.prompt.length.toLocaleString("vi-VN")} ký tự</summary><pre class="wrap">${esc(d.prompt)}</pre></details>` +
    "</div></article>";
}

function renderJudge(d) {
  const j = d.judge;
  if (!j) return `<article class="step" id="judge"><span class="c J">J</span><div><div class="stephead"><h3>Chấm điểm</h3></div><p class="void">Bài này chưa được chấm.</p></div></article>`;
  const list = (title, items) => items?.length ? `<div><h4>${title}</h4><ul>${items.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : "";
  const contract = d.contract_error
    ? `<div class="box err">Contract thất bại: ${esc(d.contract_error)}. Judge chấm ${fmtScore(d.judge_score)}, điểm tính ${fmtScore(d.score)}.</div>` : "";
  return `<article class="step" id="judge"><span class="c J">J</span><div>` +
    `<div class="stephead"><h3>Chấm điểm ${scoreCell(d.score)}</h3><span class="meter">${esc(j.level)} · ${esc(j.judge_model)}</span></div>` +
    contract + part("Model nộp", `<div class="said">${esc(j.submission_summary)}</div>`) +
    part("Đánh giá", `<div class="lists">${list("Khớp", j.matched)}${list("Thiếu", j.missed)}</div>`) +
    (j.coefficient_assessment ? part("Hệ số", `<div class="said">${esc(j.coefficient_assessment)}</div>`) : "") +
    "</div></article>";
}

function renderFlow() {
  const d = S.detail, s = S.series.find(x => x.id === S.sid);
  $("#flow").innerHTML = renderInput(d) + d.turns.map(t => renderTurn(t, s)).join("") + renderJudge(d);
}

$("#flow").addEventListener("click", e => {
  const fold = e.target.closest(".fold");
  if (fold) fold.parentElement.classList.toggle("shut");
});

/* Navigation ---------------------------------------------------------------- */
function writeHash() {
  const q = new URLSearchParams({task: S.task ?? "", series: S.sid ?? ""});
  if (S.turn) q.set("turn", S.turn);
  history.replaceState(null, "", location.pathname + location.search + "#" + q);
}

function goTo(id) {
  const main = $("#main"), el = document.getElementById(id);
  if (!el) return;
  main.scrollTop += el.getBoundingClientRect().top - $("#head").getBoundingClientRect().bottom - 10;
}

function spy() {
  const edge = $("#head").getBoundingClientRect().bottom + 14;
  let current = null;
  for (const el of document.querySelectorAll("#flow .turn")) {
    if (el.getBoundingClientRect().top > edge) break;
    current = +el.dataset.n;
  }
  if (current !== S.turn) {
    S.turn = current;
    markCurrent();
    writeHash();
  }
}

let spying = 0;
$("#main").addEventListener("scroll", () => {
  spying ||= requestAnimationFrame(() => { spying = 0; spy(); });
});

document.addEventListener("keydown", e => {
  if (e.target.matches("input, select") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "g") return toggleTruth();
  if (e.key !== "j" && e.key !== "k") return;
  const count = S.detail?.turns.length ?? 0;
  const next = (S.turn ?? 0) + (e.key === "j" ? 1 : -1);
  if (next >= 1 && next <= count) goTo(`t${next}`);
  else if (next < 1) goTo("top");
  else goTo("judge");
});

async function show(task, sid, turn = null) {
  const ticket = ++S.ticket;
  const series = S.series.find(s => s.id === sid && s.tasks[task]) ?? S.series.find(s => s.tasks[task]);
  const key = `${series.id}|${task}`;
  if (!S.cache.has(key)) {
    S.cache.set(key, await api("/api/task", {path: series.path, model: series.model, type: series.type, task}));
  }
  if (ticket !== S.ticket) return;
  Object.assign(S, {task, sid: series.id, turn, detail: S.cache.get(key)});
  document.querySelectorAll(".task").forEach(b => b.classList.toggle("on", b.dataset.task === task));
  document.querySelector(".task.on")?.scrollIntoView({block: "nearest"});
  renderHead();
  renderFlow();
  $("#main").scrollTop = 0;
  if (turn) goTo(`t${turn}`);
  writeHash();
}

async function refresh() {
  const ok = await loadRuns();
  S.cache.clear();
  renderBar();
  const names = allTasks();
  $("#empty").hidden = names.length > 0;
  $("#flow").hidden = $("#side").hidden = names.length === 0;
  if (!names.length) {
    $("#head").hidden = true;
    $("#empty").textContent = "Chưa có run nào. Dán đường dẫn tới một thư mục kết quả vào ô phía trên.";
    return ok;
  }
  renderTasks();
  await show(names.includes(S.task) ? S.task : sortedTasks()[0], S.sid, S.turn);
  return ok;
}

(async () => {
  const pinned = new URLSearchParams(location.search).getAll("run");
  S.paths = pinned.length ? pinned : ["experiments"];
  const saved = new URLSearchParams(location.hash.slice(1));
  S.task = saved.get("task");
  S.sid = saved.get("series");
  S.turn = +saved.get("turn") || null;
  await refresh();
})();
</script>
